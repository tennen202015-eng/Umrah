name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Install packages
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Prepare app files
        run: npm run build:web
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: umrah-companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk umrah-companion.apk
          gh release create "v1.0.${{ github.run_number }}" umrah-companion.apk \
            --title "رفيق العمرة 1.0.${{ github.run_number }}" \
            --notes "نزّل ملف umrah-companion.apk على الجوال وسطّبه." --latest
      - name: Store APK on the apk branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cp umrah-companion.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk && git add . 
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk
